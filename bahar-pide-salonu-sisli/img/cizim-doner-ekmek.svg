<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
  <title>Ekmek arası döner çizimi</title>
  <defs>
    <pattern id="ortu" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(6 430 200)">
      <rect width="52" height="52" fill="#FFFFFF"/>
      <rect width="26" height="52" fill="#D7263D" fill-opacity=".2"/>
      <rect width="52" height="26" fill="#D7263D" fill-opacity=".2"/>
    </pattern>
    <linearGradient id="ust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6CF8E"/><stop offset=".55" stop-color="#E0A65A"/><stop offset="1" stop-color="#C98A3D"/>
    </linearGradient>
    <linearGradient id="alt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2A85E"/><stop offset="1" stop-color="#B07434"/>
    </linearGradient>
    <path id="dilim" d="M0 14C9 3 31-2 50 3c17 5 32 2 42 9-7 13-26 19-47 16C27 25 11 29 0 14z"/>
    <g id="et">
      <use href="#dilim" fill="#8C4A22" stroke="#4A220C" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M9 12c15-7 33-7 50-3" fill="none" stroke="#C97B45" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M18 21c14 2 30 1 46 3" fill="none" stroke="#5A2B10" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>
    <g id="et2">
      <use href="#dilim" fill="#A45A2C" stroke="#4A220C" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M12 11c14-6 32-6 48-2" fill="none" stroke="#DC9563" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 20c14 3 28 2 44 4" fill="none" stroke="#6B3416" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>
    <g id="domates">
      <path d="M-30 0a30 30 0 0 1 60 0z" fill="#E2483A" stroke="#8E1B12" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-21 0a21 21 0 0 1 42 0z" fill="#F27A63"/>
      <path d="M0 -20V0M-14 -14L0 0M14 -14L0 0" stroke="#E2483A" stroke-width="4" stroke-linecap="round"/>
      <g fill="#FFE2A8"><ellipse cx="-8" cy="-7" rx="2.4" ry="3.4"/><ellipse cx="8" cy="-7" rx="2.4" ry="3.4"/></g>
    </g>
    <pattern id="kagit" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-62)">
      <rect width="16" height="16" fill="#FFFEF8"/>
      <rect width="3" height="16" fill="#D7263D" fill-opacity=".18"/>
    </pattern>
  </defs>

  <rect width="860" height="400" fill="url(#ortu)"/>

  <!-- gölge -->
  <ellipse cx="452" cy="316" rx="300" ry="26" fill="#3A1A0C" opacity=".16"/>

  <!-- turşu biber (sağ uçtan sarkan) -->
  <g transform="translate(676 214) rotate(14)">
    <path d="M0 6C30-6 70-4 104 8c8 3 6 11-2 12C66 24 30 22 0 18z" fill="#8DB73B" stroke="#2C4A16" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M10 9c26-6 56-4 82 3" fill="none" stroke="#D6E89A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- alt ekmek -->
  <path d="M152 236c10 36 58 60 140 66 84 6 196 6 276 0 82-6 128-30 136-66-60 8-170 12-276 12s-216-4-276-12z" fill="url(#alt)" stroke="#5A2B10" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M160 240c62 8 168 12 270 12s208-4 268-12" fill="none" stroke="#FBE9C4" stroke-width="7" stroke-linecap="round"/>

  <!-- marul -->
  <path d="M158 226L702 226L702 238a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0a13 11 0 0 1 -26 0L156 238z" fill="#6DBE45" stroke="#2C6B2F" stroke-width="3" stroke-linejoin="round"/>
  <path d="M176 242c60 6 140 8 210 8M470 248c70-2 140-6 200-12" fill="none" stroke="#B6E07C" stroke-width="3" stroke-linecap="round"/>

  <!-- arka sıra döner -->
  <use href="#et2" transform="translate(176 172) rotate(-8)"/>
  <use href="#et" transform="translate(262 166) rotate(3)"/>
  <use href="#et2" transform="translate(356 162) rotate(-4)"/>
  <use href="#et" transform="translate(452 164) rotate(5)"/>
  <use href="#et2" transform="translate(544 168) rotate(-3)"/>
  <use href="#et" transform="translate(614 178) rotate(10)"/>

  <!-- ön sıralar döner -->
  <use href="#et" transform="translate(150 206) rotate(-10)"/>
  <use href="#et2" transform="translate(212 196) rotate(4)"/>
  <use href="#et" transform="translate(290 192) rotate(-3)"/>
  <use href="#et2" transform="translate(352 190) rotate(6)"/>
  <use href="#et" transform="translate(470 190) rotate(-5)"/>
  <use href="#et2" transform="translate(522 194) rotate(4)"/>
  <!-- domates dilimleri -->
  <use href="#domates" transform="translate(252 214) rotate(-6)"/>
  <use href="#domates" transform="translate(424 212) rotate(4)"/>
  <use href="#domates" transform="translate(588 216) rotate(9)"/>
  <use href="#et2" transform="translate(186 214) rotate(6)"/>
  <use href="#et" transform="translate(258 212) rotate(-6)"/>
  <use href="#et2" transform="translate(330 210) rotate(3)"/>
  <use href="#et" transform="translate(400 208) rotate(-4)"/>
  <use href="#et2" transform="translate(470 210) rotate(7)"/>
  <use href="#et" transform="translate(540 214) rotate(-5)"/>
  <use href="#et" transform="translate(608 216) rotate(9)"/>

  <!-- soğan halkaları -->
  <g fill="none" stroke-linecap="round">
    <path d="M324 198c6-14 28-16 38-4" stroke="#8E3F86" stroke-width="5"/>
    <path d="M328 200c6-9 22-11 30-3" stroke="#F2DDEE" stroke-width="3"/>
    <path d="M498 200c8-13 30-13 38 0" stroke="#8E3F86" stroke-width="5"/>
    <path d="M502 202c7-8 22-8 30 0" stroke="#F2DDEE" stroke-width="3"/>
    <path d="M410 214c5-10 20-12 28-3" stroke="#8E3F86" stroke-width="4.5"/>
  </g>
  <!-- maydanoz -->
  <g fill="#3E8E41" stroke="#245E27" stroke-width="1.8">
    <path d="M376 196c4-9 14-11 20-6-3 8-12 12-20 6z"/><path d="M392 198c6-7 16-6 20 0-5 7-15 7-20 0z"/>
    <path d="M556 200c4-9 14-11 20-6-3 8-12 12-20 6z"/><path d="M646 210c5-7 15-7 19-1-5 7-14 7-19 1z"/>
  </g>

  <!-- üst ekmek -->
  <g transform="translate(0 -26) rotate(-2.5 700 186)">
  <path d="M160 186c-8-40 44-78 138-86 74-6 192-6 266 0 94 8 146 46 136 84-14 6-38 4-58 6-80 8-310 8-390 0-32-2-74 4-92-4z" fill="url(#ust)" stroke="#5A2B10" stroke-width="4.5" stroke-linejoin="round"/>
  <g fill="#FBE9C4" stroke="#A86A2B" stroke-width="3" stroke-linejoin="round">
    <path d="M250 130c26-16 66-20 92-12-24 14-62 20-92 12z"/>
    <path d="M394 116c28-12 70-14 96-4-26 12-66 14-96 4z"/>
    <path d="M540 122c28-8 64-4 86 10-28 8-62 4-86-10z"/>
  </g>
  <path d="M212 130c30-18 80-26 130-28" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="6" stroke-linecap="round"/>
  <path d="M168 184c80 8 448 10 524 0" fill="none" stroke="#FBE9C4" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  </g>

  <!-- döner kâğıdı (sol uç) -->
  <path d="M120 128l200-12c-6 30 6 54-2 84 10 30-4 62 6 96l-196 18c-20-30-24-70-18-110 2-28 4-50 10-76z" fill="url(#kagit)" stroke="#1B1B1B" stroke-width="4" stroke-linejoin="round"/>
  <path d="M296 122c-4 26 6 52-2 80 8 30-4 60 4 92" fill="none" stroke="#D7263D" stroke-width="6" stroke-linecap="round"/>
  <path d="M124 140c-4 18-6 36-8 56" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <!-- kâğıttaki kayık mühür -->
  <g transform="translate(214 214) rotate(-6)">
    <circle r="34" fill="#FFFFFF" stroke="#D7263D" stroke-width="4"/>
    <circle r="27" fill="none" stroke="#D7263D" stroke-width="1.6"/>
    <path d="M-22 1c5-9 12-13 22-13s17 4 22 11c-5 9-12 12-22 12S-17 9-22 1z" fill="#F2C27C" stroke="#A86A2B" stroke-width="2.5"/>
    <path d="M-13 1c4-4 22-4 26 0-4 4-22 4-26 0z" fill="#D7263D"/>
  </g>
</svg>
