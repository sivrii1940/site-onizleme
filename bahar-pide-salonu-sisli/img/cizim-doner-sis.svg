    <rect x="510" y="72" width="16" height="4" rx="2"/><rect x="510" y="108" width="16" height="4" rx="2"/><rect x="510" y="144" width="16" height="4" rx="2"/><rect x="510" y="180" width="16" height="4" rx="2"/><rect x="510" y="216" width="16" height="4" rx="2"/><rect x="510" y="252" width="16" height="4" rx="2"/>
