  <g transform="translate(150 262)">
    <path d="M0 30h170l-8 22H8z" fill="#3A1A0C" opacity=".18"/>
    <rect x="0" y="22" width="170" height="26" rx="6" fill="#C48A55" stroke="#7E5230" stroke-width="3.5"/>
    <path d="M14 32h110" stroke="#A9733F" stroke-width="2.5" stroke-linecap="round"/>
    <g stroke="#4A220C" stroke-width="2.4" stroke-linejoin="round">
      <path d="M22 24c10-12 30-16 46-12 12 3 22 2 30 8-8 8-24 10-40 8-14-2-26 2-36-4z" fill="#8C4A22"/>
      <path d="M60 20c12-12 34-14 50-8 10 4 20 4 28 10-10 8-26 8-42 6-14-2-28 0-36-8z" fill="#A45A2C"/>
