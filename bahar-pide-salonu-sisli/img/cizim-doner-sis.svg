    <path d="M0 26c0-6 4-10 10-10h56c6 0 10 4 10 10v78c0 8-6 12-12 12H12c-6 0-12-4-12-12z" fill="#E6F2D8" fill-opacity=".85" stroke="#1B1B1B" stroke-width="4"/>
    <g stroke="#2C4A16" stroke-width="2.5" stroke-linejoin="round">
      <path d="M14 108c-4-24 0-56 8-74 4-4 8-2 8 2-2 22-2 48 0 72z" fill="#8DB73B"/>
      <path d="M34 108c-2-26 2-52 10-66 4-4 9-2 8 3-4 20-6 42-4 63z" fill="#A5C94E"/>
      <path d="M50 108c0-20 4-40 10-50 3-3 7-1 6 3-2 14-4 30-4 47z" fill="#D7263D"/>
    </g>
    <path d="M8 32v62" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".8"/>
