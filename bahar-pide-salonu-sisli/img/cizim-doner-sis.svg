    <path d="M14 4c44-6 100-8 144-5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <rect x="168" y="-6" width="92" height="28" rx="9" fill="#1B1B1B"/>
    <g fill="#C9C9C1"><circle cx="190" cy="8" r="4"/><circle cx="214" cy="8" r="4"/><circle cx="238" cy="8" r="4"/></g>
