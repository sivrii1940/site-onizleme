  <ellipse cx="420" cy="74" rx="56" ry="4" fill="#FFFFFF" opacity=".6"/>
  <circle cx="430" cy="52" r="18" fill="#D7263D" stroke="#1B1B1B" stroke-width="4"/>
  <path d="M421 45c4-4 9-5 13-3" fill="none" stroke="#FF8A99" stroke-width="4" stroke-linecap="round"/>
  <path d="M423 35c4 2 10 2 14 0M430 35v-5" fill="none" stroke="#2C6B2F" stroke-width="4" stroke-linecap="round"/>

