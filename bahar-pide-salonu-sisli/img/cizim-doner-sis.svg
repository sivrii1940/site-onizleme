      <path d="M330 164c40 6 80-4 110 2s60 0 90-4v12c-30 4-60 8-90 2s-70 6-110-2z"/>
      <path d="M330 200c40 6 80-4 110 2s60 0 90-4v12c-30 4-60 8-90 2s-70 6-110-2z"/>
