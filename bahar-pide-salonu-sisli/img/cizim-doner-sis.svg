<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
  <title>Şişte döner çizimi</title>
  <defs>
    <pattern id="cini" width="40" height="40" patternUnits="userSpaceOnUse" x="10" y="0">
      <rect width="40" height="40" fill="#FBFBF8"/>
      <path d="M40 0H0V40" fill="none" stroke="#D6D6CF" stroke-width="2"/>
    </pattern>
    <linearGradient id="ates" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F08A3C"/><stop offset=".5" stop-color="#FFD27A"/><stop offset="1" stop-color="#F08A3C"/>
    </linearGradient>
    <linearGradient id="et-golge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E7A46A" stop-opacity=".5"/>
      <stop offset=".22" stop-color="#E7A46A" stop-opacity="0"/>
      <stop offset=".7" stop-color="#2A1206" stop-opacity="0"/>
      <stop offset="1" stop-color="#2A1206" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="celik" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EBE7"/><stop offset="1" stop-color="#AEB1AB"/>
    </linearGradient>
    <clipPath id="koni-kes">
      <path d="M338 82c0-12 184-12 184 0l-36 196c0 12-112 12-112 0z"/>
    </clipPath>
  </defs>

  <!-- çini duvar ve bordür -->
  <rect width="860" height="400" fill="url(#cini)"/>
  <rect y="296" width="860" height="14" fill="#FFFFFF"/>
  <g>
    <rect y="298" width="860" height="10" fill="#D7263D"/>
    <g fill="#1B998B">
      <rect x="34" y="298" width="10" height="10"/><rect x="80" y="298" width="10" height="10"/><rect x="126" y="298" width="10" height="10"/><rect x="172" y="298" width="10" height="10"/><rect x="218" y="298" width="10" height="10"/><rect x="264" y="298" width="10" height="10"/><rect x="310" y="298" width="10" height="10"/><rect x="356" y="298" width="10" height="10"/><rect x="402" y="298" width="10" height="10"/><rect x="448" y="298" width="10" height="10"/><rect x="494" y="298" width="10" height="10"/><rect x="540" y="298" width="10" height="10"/><rect x="586" y="298" width="10" height="10"/><rect x="632" y="298" width="10" height="10"/><rect x="678" y="298" width="10" height="10"/><rect x="724" y="298" width="10" height="10"/><rect x="770" y="298" width="10" height="10"/><rect x="816" y="298" width="10" height="10"/>
    </g>
