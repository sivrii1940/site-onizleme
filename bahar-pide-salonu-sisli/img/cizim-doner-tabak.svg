<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
  <title>Pideli döner tabağı çizimi</title>
  <defs>
    <pattern id="ortu" width="52" height="52" patternUnits="userSpaceOnUse" patternTransform="rotate(-7 430 200)">
      <rect width="52" height="52" fill="#FFFFFF"/>
      <rect width="26" height="52" fill="#D7263D" fill-opacity=".2"/>
      <rect width="52" height="26" fill="#D7263D" fill-opacity=".2"/>
    </pattern>
    <path id="dilim" d="M0 14C9 3 31-2 50 3c17 5 32 2 42 9-7 13-26 19-47 16C27 25 11 29 0 14z"/>
    <g id="et">
      <use href="#dilim" fill="#8C4A22" stroke="#4A220C" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M9 12c15-7 33-7 50-3" fill="none" stroke="#C97B45" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M18 21c14 2 30 1 46 3" fill="none" stroke="#5A2B10" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>
    <g id="et2">
      <use href="#dilim" fill="#A45A2C" stroke="#4A220C" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M12 11c14-6 32-6 48-2" fill="none" stroke="#DC9563" stroke-width="3" stroke-linecap="round"/>
      <path d="M20 20c14 3 28 2 44 4" fill="none" stroke="#6B3416" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>
    <g id="kup">
      <rect width="30" height="26" rx="7" fill="#E9B76E" stroke="#95601F" stroke-width="3"/>
      <path d="M7 8h13" stroke="#F8DDA8" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="yaprak">
      <path d="M0 0c4-9 14-11 20-6-3 8-12 12-20 6z" fill="#3E8E41" stroke="#245E27" stroke-width="2" stroke-linejoin="round"/>
      <path d="M2 -1c5-2 10-3 14-4" fill="none" stroke="#8BC34A" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="biber">
      <path d="M-10 27C22 6 80-3 128 5c10 2 10 12 1 15-42 13-92 18-124 12-5-1-9-2-15-5z" fill="#3E8E41" stroke="#1B1B1B" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M10 17c30-10 66-13 100-8" fill="none" stroke="#8BC34A" stroke-width="3.5" stroke-linecap="round"/>
      <g fill="#22341A" opacity=".75"><ellipse cx="34" cy="22" rx="7" ry="3"/><ellipse cx="66" cy="14" rx="9" ry="3.2"/><ellipse cx="86" cy="20" rx="5" ry="2.4"/></g>
      <path d="M128 11c10-4 16-11 20-20" fill="none" stroke="#245E27" stroke-width="5" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="860" height="400" fill="url(#ortu)"/>

  <!-- ayran bardağı (üstten) -->
  <g transform="translate(778 196)">
    <circle r="38" fill="#3A1A0C" opacity=".12" transform="translate(5 7)"/>
    <circle r="38" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="4"/>
    <circle r="29" fill="#FBFBF6" stroke="#DADAD2" stroke-width="2.5"/>
    <g fill="#FFFFFF" stroke="#D6D6CF" stroke-width="1.6"><circle cx="-9" cy="-6" r="6"/><circle cx="6" cy="-11" r="4.5"/><circle cx="10" cy="5" r="7"/><circle cx="-6" cy="11" r="4"/></g>
    <path d="M-24 -18a32 32 0 0 1 14-10" fill="none" stroke="#1B998B" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- tabak -->
  <ellipse cx="440" cy="216" rx="292" ry="158" fill="#3A1A0C" opacity=".14"/>
  <ellipse cx="430" cy="202" rx="292" ry="158" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="5"/>
  <ellipse cx="430" cy="202" rx="263" ry="139" fill="none" stroke="#D7263D" stroke-width="5"/>
  <ellipse cx="430" cy="202" rx="251" ry="131" fill="none" stroke="#D7263D" stroke-width="1.6"/>
  <ellipse cx="430" cy="206" rx="226" ry="114" fill="#F4F1E8"/>

  <g transform="translate(430 206) scale(1.16) translate(-430 -206)">
  <!-- pide küpleri (alt kat) -->
  <use href="#kup" transform="translate(248 172) rotate(-14)"/>
  <use href="#kup" transform="translate(236 212) rotate(8)"/>
  <use href="#kup" transform="translate(268 250) rotate(-6)"/>
  <use href="#kup" transform="translate(306 274) rotate(10)"/>
  <use href="#kup" transform="translate(350 284) rotate(-8)"/>
  <use href="#kup" transform="translate(400 290) rotate(5)"/>
  <use href="#kup" transform="translate(452 286) rotate(-10)"/>
  <use href="#kup" transform="translate(500 276) rotate(12)"/>
  <use href="#kup" transform="translate(296 132) rotate(10)"/>
  <use href="#kup" transform="translate(342 118) rotate(-6)"/>
  <use href="#kup" transform="translate(394 112) rotate(6)"/>
  <use href="#kup" transform="translate(446 114) rotate(-12)"/>
  <use href="#kup" transform="translate(496 122) rotate(8)"/>
  <use href="#kup" transform="translate(538 136) rotate(-4)"/>

  <!-- döner dilimleri -->
  <use href="#et" transform="translate(268 166) rotate(-6)"/>
  <use href="#et2" transform="translate(330 140) rotate(4)"/>
  <use href="#et" transform="translate(410 136) rotate(-3)"/>
  <use href="#et2" transform="translate(470 150) rotate(9)"/>
  <use href="#et2" transform="translate(262 214) rotate(4)"/>
  <use href="#et" transform="translate(322 236) rotate(-5)"/>
  <use href="#et2" transform="translate(400 246) rotate(3)"/>
  <use href="#et" transform="translate(468 232) rotate(-8)"/>
  <use href="#et" transform="translate(300 186) rotate(-10)"/>
  <use href="#et2" transform="translate(372 196) rotate(6)"/>
  <use href="#et" transform="translate(446 188) rotate(-4)"/>
  <use href="#et2" transform="translate(350 166) rotate(-2)"/>
  <use href="#et" transform="translate(408 214) rotate(-12)"/>
  <use href="#et2" transform="translate(316 210) rotate(12)"/>
  <use href="#et2" transform="translate(494 196) rotate(-6)"/>
  <use href="#et" transform="translate(280 238) rotate(8)"/>
  <use href="#et" transform="translate(432 262) rotate(-4)"/>
  <use href="#et2" transform="translate(356 262) rotate(5)"/>
  <use href="#et" transform="translate(372 120) rotate(-3)"/>
  <use href="#et2" transform="translate(286 150) rotate(-12)"/>

  <!-- domates sosu ve tereyağı -->
  <path d="M318 176c22-20 68-26 112-20 40 6 82 4 100 20 14 13-2 30-30 33-26 3-40 18-72 18-28 0-58-8-80-16-24-9-46-21-30-35z" fill="#C8341F" fill-opacity=".82"/>
  <path d="M360 226c-2 10-1 18 4 24M488 206c3 9 2 17-2 22" fill="none" stroke="#C8341F" stroke-opacity=".82" stroke-width="7" stroke-linecap="round"/>
  <g fill="#FFC94D" opacity=".85"><ellipse cx="372" cy="180" rx="12" ry="4"/><ellipse cx="452" cy="172" rx="9" ry="3.4"/><ellipse cx="420" cy="204" rx="14" ry="4.5"/><ellipse cx="490" cy="190" rx="6" ry="2.6"/></g>
  <path d="M342 182c14-10 34-14 52-14M440 162c18-2 38 0 54 6" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="3" stroke-linecap="round"/>

  <!-- yoğurt -->
  <path d="M548 216c-4-26 22-42 50-38 28 4 44 24 38 46-6 22-34 32-58 26-20-5-28-18-30-34z" fill="#FFFFFF" stroke="#1B1B1B" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M566 212c8-18 40-18 46 0-6 16-32 18-36 4" fill="none" stroke="#DCDCD3" stroke-width="3.5" stroke-linecap="round"/>
  <g fill="#C8341F"><circle cx="584" cy="200" r="2.6"/><circle cx="604" cy="230" r="2.2"/><circle cx="616" cy="208" r="2"/><circle cx="572" cy="234" r="2.2"/></g>

  <!-- közlenmiş biberler -->
  <use href="#biber" transform="translate(206 130) rotate(-4)"/>
  <use href="#biber" transform="translate(222 158) rotate(8) scale(.86)"/>

  <!-- közlenmiş domates -->
  <g transform="translate(286 268)">
    <circle r="31" fill="#D7263D" stroke="#1B1B1B" stroke-width="3.5"/>
    <path d="M0 -19v38M-17 -9l34 18M-17 9l34-18" stroke="#F0624D" stroke-width="5" stroke-linecap="round"/>
    <circle r="7" fill="#F0624D"/>
    <g fill="#3A1A0C" opacity=".55"><ellipse cx="-14" cy="-18" rx="7" ry="3.4" transform="rotate(-30 -14 -18)"/><ellipse cx="17" cy="16" rx="6" ry="3"/></g>
  </g>

  <!-- maydanoz -->
  <use href="#yaprak" transform="translate(520 278) rotate(-20)"/>
  <use href="#yaprak" transform="translate(540 268) rotate(30)"/>
  <use href="#yaprak" transform="translate(530 290) rotate(80)"/>
  <use href="#yaprak" transform="translate(386 120) rotate(-30) scale(.8)"/>
  <use href="#yaprak" transform="translate(404 118) rotate(20) scale(.8)"/>
  <g fill="#9E1F14"><circle cx="352" cy="200" r="1.8"/><circle cx="398" cy="186" r="1.6"/><circle cx="446" cy="214" r="1.8"/><circle cx="474" cy="182" r="1.6"/><circle cx="420" cy="166" r="1.5"/></g>
  </g>
</svg>
